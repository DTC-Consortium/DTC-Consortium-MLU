name: Publish an MLU contribution

# Packages and releases ONE approved contribution and version.
#
# Manual only, and only from main — publishing is a deliberate maintainer action against
# reviewed content, never an automatic consequence of a merge. There is deliberately no
# repository-wide "latest release": each contribution is released under its own tag so a
# link to one never resolves to another.

on:
  workflow_dispatch:
    inputs:
      contribution_id:
        description: 'Contribution ID to publish, e.g. mlu-000001'
        required: true
        type: string
      draft:
        description: 'Create the release as a draft (recommended for a first publication)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publish-${{ inputs.contribution_id }}
  cancel-in-progress: false

jobs:
  publish:
    name: Package and release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Refuse to publish from anywhere but main
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Publishing runs only from main. Got ${{ github.ref }}."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r scripts/requirements.txt

      - name: Validate everything before publishing
        run: python3 scripts/validate_contributions.py

      - name: Read the contribution's version
        id: meta
        run: |
          set -euo pipefail
          id="${{ inputs.contribution_id }}"
          dir=$(find mlu -maxdepth 2 -type d -name "${id}-*" | head -1)
          if [ -z "$dir" ]; then
            echo "::error::No contribution directory found for ${id}."
            exit 1
          fi
          version=$(python3 -c "import yaml,sys;print(yaml.safe_load(open(sys.argv[1]))['version'])" "$dir/mlu-contribution.yml")
          echo "dir=$dir"          >> "$GITHUB_OUTPUT"
          echo "version=$version"  >> "$GITHUB_OUTPUT"
          echo "tag=${id}-v${version}" >> "$GITHUB_OUTPUT"
          echo "Publishing $id v$version from $dir"

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Cut a new patch version instead —"
            echo "::error::anyone who downloaded the old package has no way to learn it changed."
            exit 1
          fi

      - name: Build the package
        run: python3 scripts/package_contribution.py "${{ inputs.contribution_id }}" --out dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          dir="${{ steps.meta.outputs.dir }}"
          title=$(python3 -c "import yaml,sys;print(yaml.safe_load(open(sys.argv[1]))['title'])" "$dir/mlu-contribution.yml")
          {
            echo "## ${title}"
            echo
            echo "\`${{ inputs.contribution_id }}\` · version ${{ steps.meta.outputs.version }}"
            echo
            echo "Download \`${tag}.zip\` below. It contains this contribution's documentation,"
            echo "metadata, licences, and distributable materials."
            echo
            echo "**Check \`LICENSE.md\` inside the package before reusing anything** — licences"
            echo "differ per contribution and often per file."
            echo
            echo "### Changes in this version"
            echo
            sed -n '/^## \[/,/^## \[/p' "$dir/CHANGELOG.md" | sed '$d'
          } > notes.md
          gh release create "$tag" "dist/${tag}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${title} ${{ steps.meta.outputs.version }}" \
            --notes-file notes.md \
            ${{ inputs.draft && '--draft' || '' }}

      - name: Remind the maintainer to link the asset
        run: |
          echo "::notice::Release ${{ steps.meta.outputs.tag }} created."
          echo "::notice::Now set github.download_url in ${{ steps.meta.outputs.dir }}/mlu-contribution.yml"
          echo "::notice::to the asset URL and rerun scripts/build_catalog.py, or the catalog will"
          echo "::notice::keep showing this contribution as 'not yet released'."
