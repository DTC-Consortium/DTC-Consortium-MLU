# Validated against ../../../schemas/mlu-contribution.schema.json
id: mlu-000004
title: Paper Autograder — Rubric-Based Draft Grading
summary: >-
  Point this notebook at your course material, a grading rubric, and a folder of student
  papers. For each paper it scores every rubric criterion, backs each score with verbatim
  quotes, computes the weighted grade in code rather than in the model, and drafts
  separate notes for the instructor and for the student. Runs on Bedrock or fully local
  via Ollama, where nothing leaves the machine.
category: ml-ai-applications
subtype: notebook-tool

authors:
  - name: Tariq Hook
    institution: Delaware State University
institutions:
  - Delaware State University
maintainer:
  name: DTCC MLU Maintainers
  contact: "@DTC-Consortium/mlu-ml-ai-applications"

disciplines:
  - Cross-disciplinary
  - Faculty Development
topics:
  - rubric-based assessment
  - grounded correctness judgment
  - human review of AI output
  - FERPA and student records
tools:
  - Amazon Bedrock
  - Amazon Nova Lite
  - Amazon SageMaker Studio
  - Ollama
  - LangChain
  - FAISS
  - Jupyter
  - Python
audience:
  - Faculty
  - Adjunct faculty

intended_use:
  description: >-
    Drafts rubric-based grades for written work. Criteria about using course concepts
    correctly are judged only against the instructor's embedded material, so a confident,
    well-written paper that misuses the concepts scores lower rather than higher. The
    overall grade is computed in code from tiers and criterion weights. This is not a
    plagiarism or AI-writing detector and must never inform an academic-integrity decision.
  learning_outcomes:
    - Express a grading rubric in a machine-readable form with explicit criterion weights.
    - Distinguish fluent writing from correct reasoning when reviewing drafted grades.
    - Review evidence-backed drafts and override them before recording any grade.

prerequisites:
  knowledge:
    - Comfort running cells in a notebook.
    - >-
      Institutional clearance to process student papers. FERPA in the US, or the local
      equivalent. The Ollama path keeps papers on the local machine.
  accounts:
    - "Bedrock path: AWS account with SageMaker Studio and Nova Lite model access"
    - "Local path: none — Ollama runs on the instructor's own machine"
  expected_cost: >-
    Under USD 1 per stack of papers on the Bedrock path. None on the Ollama path.

