id: mlu-000003
title: Class Participation Scoring — Transcript to Draft Score
summary: >-
  Point this notebook at a Zoom transcript of one class meeting and the material you
  covered that day. It identifies who spoke, judges what they talked about against your
  embedded lesson rather than the model's own knowledge, and drafts a 0–4 participation
  score per student with the evidence behind it. The output is a draft a human reviews,
  never a grade the tool assigns on its own.
category: ml-ai-applications
subtype: notebook-tool

authors:
  - name: Tariq Hook
    institution: Delaware State University
institutions:
  - Delaware State University
maintainer:
  name: DTCC MLU Maintainers
  contact: "@DTC-Consortium/mlu-ml-ai-applications"

disciplines:
  - Cross-disciplinary
  - Faculty Development
topics:
  - participation assessment
  - transcript analysis
  - retrieval-augmented relevance judgment
  - human review of AI output
  - FERPA and student records
tools:
  - Amazon Bedrock
  - Amazon Nova Lite
  - Amazon SageMaker Studio
  - LangChain
  - FAISS
  - Jupyter
  - Python
audience:
  - Faculty
  - Adjunct faculty

intended_use:
  description: >-
    Drafts class-participation scores for a discussion-based course from a recorded class
    transcript, so an instructor reviews evidence-backed drafts instead of scoring from
    memory. Each score combines quantity, topical relevance judged against the day's
    embedded lesson material, and substance. Requires instructor review before any score
    is recorded.
  learning_outcomes:
    - Ground a relevance judgment in supplied course material rather than model priors.
    - Review and override AI-drafted scores using the evidence attached to each one.
    - Apply institutional policy on class recording and student records before using real transcripts.

prerequisites:
  knowledge:
    - Comfort running cells in a notebook.
    - >-
      Institutional clearance to use class recordings and transcripts, with students
      notified. FERPA in the US, or the local equivalent.
  accounts:
    - AWS account with Amazon SageMaker Studio access
    - Amazon Bedrock model access for Amazon Nova Lite in the session region
  expected_cost: Under USD 1 per class meeting scored, in Bedrock inference.

