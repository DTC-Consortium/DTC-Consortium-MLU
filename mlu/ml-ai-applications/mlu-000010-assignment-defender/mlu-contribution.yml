id: mlu-000010
title: Assignment Defender — AI-Proofing Assistant
summary: >-
  A published Amazon Quick app that reads an assignment's goals, instructions, and rubric,
  then estimates how well generative AI could satisfy it on its own. Faculty set the maximum
  grade they think an AI-only submission should earn, and the app returns an AI Robustness
  Score, a SWOT analysis, and three redesign options at increasing strength. The goal is not
  to block AI but to find where it substitutes for the skill actually being assessed. No
  account or coding needed to use it.
