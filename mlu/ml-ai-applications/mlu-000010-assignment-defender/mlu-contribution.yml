intended_use:
  description: >-
    A formative instructional-design and decision-support tool for faculty redesigning an
    assessment. It takes assignment goals, learning objectives, instructions, and grading
    criteria, plus a faculty-set ceiling for what an AI-only submission should be able to
    earn, and returns an AI Robustness Score, a SWOT review, and three redesign options —
    Minimum Robustness, Heightened Security, and Best Fit. It does not make an assignment
    AI-proof and it does not detect AI use; it identifies where AI can substitute for the
    skill being assessed so a human can decide what to change. Every recommendation is a
    draft for faculty judgment, to be checked against course outcomes, accessibility needs,
    disciplinary expectations, workload, and institutional policy before adoption.
  learning_outcomes:
    - Identify which parts of an existing assignment generative AI could satisfy without the student demonstrating the target skill.
    - Set and defend a deliberate ceiling for what an AI-only submission should be able to earn.
    - Rewrite rubric criteria so that credit depends on evidence AI cannot supply, such as named personal experience or exact figures from an attached dataset.
    - Distinguish assessment redesign from AI detection, and explain why the first is durable and the second is not.

prerequisites:
  knowledge:
    - An assignment you already teach, with its instructions, learning objectives, and grading criteria as text.
    - No coding experience, and no Amazon Quick account, is required to use the published app.
  accounts:
    - >-
      None to use the public app. An Amazon Quick account is needed only to duplicate or
      build your own version.
  expected_cost: >-
    None to use the published app. Any cost of building your own copy depends on the Amazon
    Quick plan your institution holds.

