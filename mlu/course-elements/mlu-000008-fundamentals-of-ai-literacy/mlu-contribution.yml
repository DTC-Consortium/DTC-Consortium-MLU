# Validated against ../../../schemas/mlu-contribution.schema.json
id: mlu-000008
title: Fundamentals of AI Literacy
summary: >-
  A self-paced, non-credit online course that introduces AI to people who will never build
  one — new students, faculty, and staff. Three video modules with quizzes carry the
  vocabulary, from machine learning through agentic AI, and a final project makes it
  concrete: students write one structured prompt about careers in their own major, run it
  unchanged through PartyRock, ChatGPT, and Copilot, and defend which answer was best.
  Completion earns a digital badge.
category: course-elements
subtype: course

authors:
  - name: Lisa Taylor
    institution: Talladega College
institutions:
  - Talladega College
maintainer:
  name: DTCC MLU Maintainers
  contact: "@DTC-Consortium/mlu-course-elements"

disciplines:
  - Cross-disciplinary
  - Faculty Development
  - Education
topics:
  - AI literacy
  - prompt engineering
  - responsible AI
  - career exploration
  - model comparison
  - onboarding and orientation
tools:
  - Amazon PartyRock
  - ChatGPT
  - Microsoft Copilot
audience:
  - Undergraduate students
  - Faculty
  - Academic staff

intended_use:
  learning_outcomes:
    - Explain why AI literacy is becoming essential across every career field.
    - Differentiate between AI, machine learning, deep learning, foundation models, LLMs, generative AI, and agentic AI.
    - Identify workplace applications of AI across multiple industries.
    - Write effective prompts using a structured Role / Context / Task / Format / Constraints framework.
    - Recognize hallucinations, bias, toxicity, privacy risks, and other responsible-AI concerns.
    - Compare outputs generated by multiple AI models on one identical prompt.
    - Apply responsible AI principles in workplace scenarios.

prerequisites:
  knowledge:
    - None. The course is written for non-technical participants with no prior AI exposure.
  accounts:
    - A free Amazon account for PartyRock sign-in.
    - A free ChatGPT account, via Google, Microsoft, Apple, or email.
    - A free Microsoft account for Copilot.
    - An LMS such as Canvas, for the module quizzes, flashcard activities, and final-project submission.
  expected_cost: >-
    None. All three AI tools are used on their free tiers and no credit card is required.

