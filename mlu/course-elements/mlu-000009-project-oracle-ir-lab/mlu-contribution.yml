materials:
  - path: materials/assignments/lab-project.md
    description: >-
      The capstone lab project — a 1,200–1,600 word research design in five required
      sections, two submission tracks (build-the-bot or write-it-yourself, each with its own
      AI transparency requirements), the Cooperative Critique oral defense format, both
      grading rubrics, and the five defense prompts.
  - path: materials/lectures/lab-intensive-1.1-slides.pdf
    description: "Lab Intensive 1, session 1 — Alien Invasion: GenAI intro and academic ethics."
  - path: materials/lectures/lab-intensive-1.2-slides.pdf
    description: "Lab Intensive 1, session 2 — LLM limitations, and why submissions sound \"like AI\"."
  - path: materials/lectures/lab-practical-1-slides.pdf
    description: Lab Practical 1 — GenAI as a subject-matter expert; prompt crafting and role definition.
  - path: materials/references/pre-lecture-international-society.pdf
    description: >-
      Pre-lecture reading on International Society and Hedley Bull's three traditions, the
      theoretical grounding for Lab Practical 1.
  - path: materials/references/partyrock-apps.md
    description: Links to the instructor-built PartyRock apps the labs use, with a caution about hosted-app drift.
  - path: materials/references/oacc-workforce-readiness-non-stem-genai.pdf
    description: >-
      The author's conference presentation on the problem this module addresses — using
      GenAI to build workforce readiness in non-STEM fields.
  - path: materials/faculty-guide/course-design-notes.md
    description: >-
      The author's working design notes — the 16-week schedule, per-practical design grid,
      and pedagogical rationale. Notes, not a finished facilitator guide; see its preamble.

