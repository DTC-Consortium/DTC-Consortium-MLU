intended_use:
  learning_outcomes:
    - Apply IR theories and approaches to a focused question concerning an extraterrestrial encounter.
    - Develop and communicate a research design that reflects academic reasoning, data–method fit, and awareness of bias.
    - Describe the basic functions of general LLMs and express their limitations for academic work.
    - Use GenAI tools ethically to support idea generation, literature identification, and clarity, and document that use.
    - Evaluate the strengths and limitations of GenAI's role in social-science research.
    - Reflect on the utility of GenAI in their academic, professional, or personal futures.

prerequisites:
  knowledge:
    - Concurrent or prior enrolment in an International Relations course. The module assumes exposure to IR theory, including Hedley Bull's three traditions.
    - No programming background is required of students or instructor.
    - >-
      INSTRUCTOR: this is a scaffolding template, not a turnkey lab. The design notes carry
      "Not specified" fields and two unwritten session outlines, and the PartyRock apps are
      hosted objects that must be re-tested before delivery. Budget adaptation time.
  accounts:
    - Access to at least one major LLM (Claude, GPT, or similar) for initial prompting exercises.
    - A free PartyRock account for building apps. Model access varies by region; us-east-1 or us-west-2 are known to work.
    - Institutional access to the local academic-integrity policy, which the labs reference directly.
  expected_cost: >-
    None beyond standard tuition and fees. All required tools are used on free tiers.

