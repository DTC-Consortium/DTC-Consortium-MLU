id: mlu-000006
title: Build and Evaluate an AI Marketing Assistant in PartyRock
summary: >-
  A no-code assignment in which students build a working marketing-content app in Amazon
  PartyRock, then run one identical scenario through three prompt strategies — bare, role
  plus context, and fully structured — and score the three outputs against the same five
  criteria. The app is the hook; the comparison table is the assignment. Built for a
  mixed-major audience with no programming background.
category: course-elements
subtype: assignment

authors:
  - name: Sara Mathew
    institution: Oklahoma City Community College
institutions:
  - Oklahoma City Community College
maintainer:
  name: DTCC MLU Maintainers
  contact: "@DTC-Consortium/mlu-course-elements"

disciplines:
  - Business
  - Computer Science
  - Cross-disciplinary
topics:
  - prompt engineering
  - no-code AI
  - generative AI literacy
  - marketing communication
  - output evaluation
tools:
  - Amazon PartyRock
audience:
  - Undergraduate students
  - Faculty

intended_use:
  learning_outcomes:
    - Build a functioning generative-AI application without writing code.
    - Reference app inputs inside a prompt so that outputs change with user input.
    - Compare a bare prompt, a role-and-context prompt, and a structured prompt on one identical scenario.
    - Score generative-AI output against relevance, specificity, tone, completeness, and usability rather than accepting it at face value.
    - Explain which prompt elements — role, context, tone, constraints, output format — most changed the result, citing their own outputs.

prerequisites:
  knowledge:
    - None. No programming background is assumed of students or instructor.
    - Students should be able to describe a product or service in a few sentences.
  accounts:
    - A free PartyRock sign-in via an Apple, Google, or Amazon account. No AWS account or credit card is required.
  expected_cost: >-
    None. PartyRock is free to use and requires no credit card. Budget instructor time to
    verify that partyrock.aws is reachable from the campus network before the session.

