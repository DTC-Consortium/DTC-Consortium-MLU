# Validated against ../../../schemas/mlu-contribution.schema.json
id: mlu-000001
title: Curriculum Embedding Lab — Embed AI in Your Course
summary: >-
  A 90-minute faculty lab whose deliverable is a decision, not a demo. Each participant
  builds a working, discipline-grounded AI tool from a persona matched to their field,
  then writes a curriculum plan for where it belongs in a course they actually teach —
  and, explicitly, where it does not. Ships with a student-facing companion notebook
  (Quiz Me, Socratic Hint, Explain-Back) and six licence-clean discipline personas.
category: professional-student-development
subtype: lab

authors:
  - name: Tariq Hook
    institution: Delaware State University
institutions:
  - Delaware State University
maintainer:
  name: DTCC MLU Maintainers
  contact: "@DTC-Consortium/mlu-professional-student-development"

disciplines:
  - Faculty Development
  - Cross-disciplinary
topics:
  - curriculum design
  - retrieval-augmented generation
  - AI boundaries in teaching
  - academic integrity
tools:
  - Amazon Bedrock
  - Amazon Nova Lite
  - Amazon SageMaker Studio
  - LangChain
  - FAISS
  - Jupyter
  - Python
audience:
  - Faculty
  - Academic staff
  - Instructional designers

intended_use:
  learning_outcomes:
    - Identify where in a specific course an AI tool adds instructional value, and articulate what the instructor still does.
    - Build a discipline-grounded AI tool from a persona brief, using retrieval over a real document from the field.
    - State an explicit boundary for where AI does not belong in one's own teaching, and defend it.
    - Commit to one dated, specific instructional action.

prerequisites:
  knowledge:
    - No coding experience required; participants run about five cells of Python.
  accounts:
    - AWS account with Amazon SageMaker Studio access
    - Amazon Bedrock model access for Amazon Nova Lite in the session region
  expected_cost: >-
    Under USD 1 per participant in Bedrock inference. SageMaker Studio compute is billed
    for the duration of the session and should be shut down afterward.

