materials:
  - path: materials/facilitator-guide/00-READ-ME-FIRST.md
    description: >-
      Start here. What to read in what order, the three constraints that shape the session, and
      what goes wrong on the day.
  - path: materials/prompts/
    description: >-
      The five prompts. Three the room builds its own tools from; two the facilitator prepares in
      advance. Each carries the outputs it must produce on the sample pack.
  - path: materials/prompts/MASTER-FOLLOW-ALONG.md
    description: >-
      The single document attendees follow for the whole session. Every step is self-contained:
      the paper, the rubric, the assignment and all three prompts are inside it.
  - path: materials/prompts/DRIVE-FOLDER.md
    description: What goes in the shared folder attendees scan into, how to lay it out, and what must not.
  - path: materials/assessment-lifecycle-deck.pdf
    description: The session deck, 90 minutes.
  - path: materials/assessment-lifecycle-deck.pptx
    description: Editable source of the deck.
  - path: materials/build_deck.py
    description: Script that regenerates the deck from source.
  - path: materials/verify_deck.py
    description: >-
      Proves a rebuilt deck only ever REMOVES copy from the approved slides. Gates the PDF export.
  - path: materials/DECK-APPROVAL.md
    description: What may and may not change on the approved slides, and why a checksum was the wrong check.
  - path: materials/dist/
    description: Built PDFs — the follow-along guide, the facilitator guide, and the take-home pack.
  - path: materials/facilitator-guide/TALK_TRACK.md
    description: >-
      Per-slide talk track — what must be true before each slide, what to say, what to do,
      and the one thread to protect if time runs short.
  - path: materials/participant-resources/hook-handout.md
    description: The opening handout the room grades from.
  - path: materials/activities/sample-pack/
    description: One assignment, one course reading, two rubrics, and five students.
  - path: materials/activities/rubric-format.md
    description: >-
      The mlu-rubric/1 format shared by the session tools. A rubric in this format loads
      unchanged into mlu-000004.

