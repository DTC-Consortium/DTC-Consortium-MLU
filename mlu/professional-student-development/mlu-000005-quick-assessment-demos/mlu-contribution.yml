# Validated against ../../../schemas/mlu-contribution.schema.json
id: mlu-000005
title: The Assignment Lifecycle — Quick Assessment Demo Session
summary: >-
  A 90-minute facilitated session that walks a room through one assignment's full
  lifecycle — write the rubric, stress-test it, grade against it, and triage submissions
  before the deadline. Built around a single fluent, confident, and wrong student paper
  that earns a B+ under a vague rubric and an F under a rubric that names what correct
  means. Ships a deck, a talk track, a participant handout, and a five-student sample pack.
category: professional-student-development
subtype: workshop

authors:
  - name: Tariq Hook
    institution: Delaware State University
institutions:
  - Delaware State University
maintainer:
  name: DTCC MLU Maintainers
  contact: "@DTC-Consortium/mlu-professional-student-development"

disciplines:
  - Faculty Development
  - Cross-disciplinary
  - Computer Science
topics:
  - rubric design
  - assessment lifecycle
  - pre-deadline triage
  - fluency versus correctness
tools:
  - PowerPoint
  - Python
audience:
  - Faculty
  - Workshop facilitators
  - Instructional designers

intended_use:
  learning_outcomes:
    - Diagnose why a rubric that rewards visible surface features misgrades a confidently wrong paper.
    - Write a rubric whose criteria name what correct looks like and map to stated learning objectives.
    - Stress-test a rubric against a paper designed to exploit its weaknesses.
    - Use pre-deadline triage to surface missing criteria while students can still act on it.

prerequisites:
  knowledge:
    - Participants bring one assignment prompt and its learning objectives, as text. No student work.
  accounts: []
  expected_cost: >-
    None for the materials themselves. The session demonstrates chat-based AI tools;
    any per-seat cost depends on which tool the facilitator uses.

