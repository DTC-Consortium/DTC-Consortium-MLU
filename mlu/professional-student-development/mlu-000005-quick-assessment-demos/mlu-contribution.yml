# Validated against ../../../schemas/mlu-contribution.schema.json
id: mlu-000005
title: The Assignment Lifecycle — Quick Assessment Demo Session
summary: >-
  A 90-minute facilitated session that walks a room through one assignment's full
  lifecycle — write the rubric, stress-test it, grade against it, and triage submissions
  before the deadline. Built around a single fluent, confident, and wrong student paper
  that earns a high grade under a vague rubric and an F under a rubric that names what correct
  means. The room builds three of the four tools itself, from prompts, in about ninety seconds
  each. Ships the prompts, a deck, a talk track, one follow-along document, and a sample pack.
category: professional-student-development
subtype: workshop

authors:
  - name: Tariq Hook
    institution: Delaware State University
institutions:
  - Delaware State University
maintainer:
  name: DTCC MLU Maintainers
  contact: "@DTC-Consortium/mlu-professional-student-development"

disciplines:
  - Faculty Development
  - Cross-disciplinary
  - Computer Science
topics:
  - rubric design
  - assessment lifecycle
  - pre-deadline triage
  - fluency versus correctness
tools:
  - Amazon Quick
  - Kiro
  - PowerPoint
  - Python
audience:
  - Faculty
  - Workshop facilitators
  - Instructional designers

intended_use:
  learning_outcomes:
    - Diagnose why a rubric that rewards visible surface features misgrades a confidently wrong paper.
    - Write a rubric whose criteria name what correct looks like and map to stated learning objectives.
    - Stress-test a rubric against a paper designed to exploit its weaknesses.
    - Use pre-deadline triage to surface missing criteria while students can still act on it.

prerequisites:
  knowledge:
    - >-
      None for participants. Everything they grade, paste and build is provided in one
      follow-along document; they do not bring their own assignment.
    - >-
      FACILITATOR: build the two facilitator-led tools before delivery, from
      materials/prompts/facilitator/. The room builds the other three live, from prompts.
    - >-
      FACILITATOR: assemble the shared folder attendees scan into. See
      materials/prompts/DRIVE-FOLDER.md.
  accounts:
    - Amazon Quick account for the facilitator and every attendee. Free to set up and use.
    - Kiro access for the facilitator, for the grading segment the room watches
    - A file-sharing folder attendees can open without signing in
  expected_cost: >-
    None for the materials themselves, and none for Amazon Quick, which is free to set up and
    use. Budget facilitator time to build the two demo tools and to rehearse the three the room
    builds, so you know how long each takes on an unfamiliar account.

