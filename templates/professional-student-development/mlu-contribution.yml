  contact: "@DTC-Consortium/your-team"

disciplines:
  - Faculty Development
topics:
  - replace me
tools:
  - PowerPoint
audience:
  - Faculty

# What someone can do afterwards. Concrete enough to plan a session around.
intended_use:
  learning_outcomes:
    - Replace me with a specific, checkable outcome.
    - And another.


prerequisites:
  knowledge:
    - What someone needs to already know or have prepared.
  accounts:
    # Every account a participant must hold. Be specific: "an AWS account" is not enough
    # if model access must also be enabled in a particular region. Use [] only if truly none.
    - Replace me, or use an empty list
  expected_cost: >-
    Plain language. "None", or something like "under USD 1 per participant in inference".
    Someone deciding whether they can afford to run this needs a real answer.

